name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level low
      - name: Audit all dependencies
        run: pnpm audit --audit-level low
      - name: Check patch formatting
        run: git diff --check
      - name: Verify bundle fixtures
        run: pnpm verify:bundles
      - name: Typecheck and build
        run: pnpm check
      - name: Install Chromium for browser smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          set -euo pipefail
          pnpm start > /tmp/lachesis-explorer-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          pnpm test:browser

  bundle-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run service contract and worker tests
        run: python -m unittest discover -s services/bundle-service/tests -v
        env:
          PYTHONPATH: services/bundle-service
      - name: Check hosted smoke runner syntax
        run: node --check services/bundle-service/smoke-hosted.mjs
      - name: Install CloudFormation linter
        run: python -m pip install --quiet cfn-lint
      - name: Lint hosted service template
        run: cfn-lint services/bundle-service/template.yaml
