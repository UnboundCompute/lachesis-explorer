name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check patch formatting
        run: git diff --check
      - name: Verify bundle fixtures
        run: pnpm verify:bundles
      - name: Typecheck and build
        run: pnpm check

  bundle-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run service contract and worker tests
        run: python -m unittest discover -s services/bundle-service/tests -v
        env:
          PYTHONPATH: services/bundle-service
      - name: Install CloudFormation linter
        run: python -m pip install --quiet cfn-lint
      - name: Lint hosted service template
        run: cfn-lint services/bundle-service/template.yaml
