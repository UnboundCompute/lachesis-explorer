AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hosted Lachesis graph build and opaque bundle delivery service.

Parameters:
  ExplorerOrigin:
    Type: String
    Description: Exact Explorer origin allowed to call the API, for example https://lachesis.unboundcompute.com.
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'
    ConstraintDescription: ExplorerOrigin must be a single HTTPS origin without a path, query, or wildcard.
  WorkerImageUri:
    Type: String
    Description: ECR URI for the worker image containing git, Lachesis, and its language toolchains.
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$'
    ConstraintDescription: WorkerImageUri must be an immutable regional ECR image digest, not a tag.
  AlertTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for hosted service alarms.
    AllowedPattern: '^$|^arn:[A-Za-z0-9-]+:sns:[A-Za-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$'
    ConstraintDescription: AlertTopicArn must be empty or a valid regional SNS topic ARN.

Conditions:
  HasAlertTopic: !Not [!Equals [!Ref AlertTopicArn, '']]

Resources:
  BundleBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration:
        Rules: [{ Id: ExpireBundles, Status: Enabled, ExpirationInDays: 30 }]

  BundleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BundleBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BundleBucket.Arn, !Sub '${BundleBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: false } }

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: job_id, AttributeType: S }]
      KeySchema: [{ AttributeName: job_id, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  BuildDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  BuildQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Keep messages invisible for at least six times the worker timeout so a
      # long invocation is not delivered to a second worker while still running.
      VisibilityTimeout: 5400
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt BuildDlq.Arn, maxReceiveCount: 2 }

  BuildApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref ExplorerOrigin]
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, OPTIONS]
      DefaultRouteSettings: { ThrottlingBurstLimit: 10, ThrottlingRateLimit: 2 }

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: src/
      Timeout: 30
      MemorySize: 512
      Events:
        Build: { Type: HttpApi, Properties: { ApiId: !Ref BuildApi, Path: /api/build, Method: POST } }
        BuildStatus: { Type: HttpApi, Properties: { ApiId: !Ref BuildApi, Path: '/api/build/{job_id}', Method: GET } }
        BuildCancel: { Type: HttpApi, Properties: { ApiId: !Ref BuildApi, Path: '/api/build/{job_id}/cancel', Method: POST } }
        Bundle: { Type: HttpApi, Properties: { ApiId: !Ref BuildApi, Path: '/api/bundles/{bundle_id}', Method: GET } }
      Environment:
        Variables: { JOBS_TABLE: !Ref JobsTable, BUILD_QUEUE_URL: !Ref BuildQueue, BUNDLE_BUCKET: !Ref BundleBucket, EXPLORER_ORIGIN: !Ref ExplorerOrigin, BUILD_RATE_LIMIT: '5' }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt BuildQueue.QueueName }
        - S3ReadPolicy: { BucketName: !Ref BundleBucket }

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Architectures: [x86_64]
      ImageConfig: { Command: [worker.handler] }
      # This account/region currently rejects values above 3008 MB for Lambda.
      # Keep the worker within that deployed quota until a higher-memory quota is approved.
      MemorySize: 3008
      Timeout: 900
      EphemeralStorage: { Size: 10240 }
      # Leave concurrency unreserved by default: this account's Lambda floor
      # rejects any reservation that would take unreserved capacity below 10.
      # BatchSize=1 still prevents one invocation from processing multiple jobs.
      Events: { Build: { Type: SQS, Properties: { Queue: !GetAtt BuildQueue.Arn, BatchSize: 1, FunctionResponseTypes: [ReportBatchItemFailures] } } }
      Environment:
        Variables: { JOBS_TABLE: !Ref JobsTable, BUNDLE_BUCKET: !Ref BundleBucket, BUILD_TIMEOUT_SECONDS: '600', MAX_REPOSITORY_FILES: '5000', LACHESIS_CACHE_VERSION: 'lachesis-0.5.0|explorer-2.0' }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - S3ReadPolicy: { BucketName: !Ref BundleBucket }
        - S3WritePolicy: { BucketName: !Ref BundleBucket }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFunction}
      RetentionInDays: 30

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hosted bundle API is returning Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertTopic, [!Ref AlertTopicArn], !Ref AWS::NoValue]

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hosted bundle worker is failing build jobs.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref WorkerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertTopic, [!Ref AlertTopicArn], !Ref AWS::NoValue]

  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hosted bundle jobs are waiting in the build queue.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt BuildQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertTopic, [!Ref AlertTopicArn], !Ref AWS::NoValue]

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hosted bundle jobs reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt BuildDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertTopic, [!Ref AlertTopicArn], !Ref AWS::NoValue]

Outputs:
  ApiUrl: { Description: API base URL for NEXT_PUBLIC_BUNDLE_API_URL, Value: !Sub 'https://${BuildApi}.execute-api.${AWS::Region}.amazonaws.com' }
  BundleBucketName: { Value: !Ref BundleBucket }
  JobsTableName: { Value: !Ref JobsTable }
